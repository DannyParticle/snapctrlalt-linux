name: 功能建议
description: 想要的新能力或交互改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的设想
      description: 如果参考了别的截图工具（Flameshot / ksnip / QQ 截图），也请说明
    validations:
      required: false
